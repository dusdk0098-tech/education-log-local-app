<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:">
  <title>PEDIT EDU</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1218; color: #f4f6f8; }
    main { width: min(540px, calc(100vw - 64px)); padding: 44px; border: 1px solid #26323d; background: #111b23; box-shadow: 0 24px 70px #0008; }
    .mark { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 28px; background: #f36a16; color: white; font-weight: 800; font-size: 22px; }
    h1 { margin: 0 0 14px; font-size: 26px; letter-spacing: -.02em; }
    p { margin: 0; color: #aab5bf; line-height: 1.7; }
    strong { color: #f36a16; }
  </style>
</head>
<body>
  <main>
    <div class="mark">P</div>
    <h1>통합 런처에서 실행해 주세요</h1>
    <p>PEDIT EDU는 사용자 인증과 앱 사용 권한을 <strong>PEDIT Launcher</strong>에서 확인한 뒤 실행됩니다. 런처로 돌아가 앱 라이브러리에서 다시 실행해 주세요.</p>
  </main>
</body>
</html>
